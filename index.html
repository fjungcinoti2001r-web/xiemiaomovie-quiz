<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局部猜苗片</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #FFF8EA; 
            color: #5C4033; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#FAD6A5 10%, transparent 11%);
            background-size: 30px 30px; 
        }

        .game-container {
            background-color: #FFFFFF;
            width: 90%;
            max-width: 450px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.5);
            padding: 30px 20px 20px 20px;
            text-align: center;
            border: 4px solid #FAD6A5;
            position: relative;
            display: none; 
        }

        #start-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .title-group h1 {
            font-size: 24px; 
            margin: 0 0 5px 0;
            color: #D2691E;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 14px;
            color: #8B5A2B;
            font-weight: bold;
        }

        .progress {
            font-size: 14px;
            font-weight: bold;
            background-color: #FFEFD5;
            padding: 6px 18px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 2px dashed #DEB887;
        }

        .image-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #F5F5DC;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 3px solid #DEB887;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #FFE4C4;
            border: 2px solid #F5DEB3;
            color: #5C4033;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #DEB887;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #FFDAB9;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #DEB887;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: none;
        }

        .option-btn.correct-btn {
            background-color: #C1E1C1 !important;
            border-color: #93C572 !important;
            color: #2E8B57 !important;
            box-shadow: none !important;
        }

        .option-btn.wrong-btn {
            background-color: #FFC0CB !important;
            border-color: #FF69B4 !important;
            color: #C71585 !important;
            box-shadow: none !important;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.95;
        }

        .feedback-box {
            height: 24px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback-box.show { opacity: 1; }
        .feedback-box.correct-text { color: #4CAF50; }
        .feedback-box.wrong-text { color: #FF6347; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .start-btn, .restart-btn, .poster-btn {
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .start-btn { background-color: #FFA07A; box-shadow: 0 6px 0 #E9967A; }
        .poster-btn { background-color: #20B2AA; box-shadow: 0 6px 0 #008B8B; }
        .restart-btn { background-color: #FFB6C1; box-shadow: 0 6px 0 #FF69B4; }
        
        .start-btn:active, .poster-btn:active, .restart-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* 海报截图区改为纯白底，完美融合图片底色 */
        #capture-area {
            width: 100%;
            aspect-ratio: 1 / 1; 
            background-color: #FFFFFF;
            border-radius: 20px;
            border: 4px solid #FAD6A5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 15px;
            margin-bottom: 20px;
        }

        #poster-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #generated-poster {
            width: 85%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            border: 4px solid #FFF;
            object-fit: cover;
        }
        .poster-tips {
            color: white;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
        }
        
        .modal-btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .save-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;

            border: 2px solid white;
            padding: 8px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;

</head>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSoundEffect(type) {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        }
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.3);
    }

        { image: "./images/狂虎危城 张柳平.jpg", options: ["《狂虎危城》张柳成", "《狂虎危城》张柳平", "《破神录》", "《目中无人2》"], answer: "《狂虎危城》张柳平" },

        { image: "./images/谢苗本人.jpg", options: ["《新少林五祖》", "谢苗本人", "《给爸爸的信》", "《小飞侠》"], answer: "谢苗本人" }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    let currentQuestionIndex = 0;
    let score = 0;

    function startGame() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playSoundEffect('correct');
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.3; 
        bgm.play().catch(e => console.log("BGM 播放需确保文件存在"));

        shuffleArray(questions);

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        const currentQ = questions[currentQuestionIndex];
        document.getElementById('progress-text').innerText = `第 ${currentQuestionIndex + 1} / ${questions.length} 题`;
        
        const imgEl = document.getElementById('question-image');
        const basePath = currentQ.image.substring(0, currentQ.image.lastIndexOf('.'));
        const extensions = ['.jpg', '.png', '.jpeg', '.JPG', '.PNG'];
        let attempt = 0;

        imgEl.onerror = null;
        imgEl.onerror = function() {
            attempt++;
            if (attempt < extensions.length) {
                imgEl.src = encodeURI(basePath + extensions[attempt]);
            } else {
                imgEl.alt = "图片加载失败，请检查名称是否完全一致";
            }
        };
        imgEl.src = encodeURI(basePath + extensions[0]);
        
        const optionsBox = document.getElementById('options-box');
        const feedbackBox = document.getElementById('feedback-box');
        optionsBox.innerHTML = "";
        feedbackBox.className = "feedback-box"; 
        feedbackBox.innerText = "";

        currentQ.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(btn, option, currentQ.answer);
            optionsBox.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedText, correctText) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);
        const feedbackBox = document.getElementById('feedback-box');

        let isCorrect = (selectedText === correctText);
        let delayTime = isCorrect ? 800 : 1000;

        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct-btn');
            feedbackBox.innerText = "✨ 好厉害，答对了！";
            feedbackBox.classList.add('correct-text', 'show');
            playSoundEffect('correct'); 
        } else {
            selectedBtn.classList.add('wrong-btn');
            feedbackBox.innerText = `❌ 哎呀，正确答案是：${correctText}`;
            feedbackBox.classList.add('wrong-text', 'show');
            playSoundEffect('wrong'); 
            
            allBtns.forEach(btn => {
                if (btn.innerText === correctText) btn.classList.add('correct-btn');
            });
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }, delayTime);
    }

    function showResult() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;

        let title = "";
        let ratio = score / questions.length;
        if (ratio === 1) title = "苗哥本人小号 👑";
        else if (ratio >= 0.7) title = "谢苗宇宙十级学者 🎓";
        else if (ratio >= 0.4) title = "网大动作片野生影迷 🍿";
        else title = "路过看热闹的群众 🚶‍♂️";

        document.getElementById('player-title').innerText = title;
    }

    // 生成海报
    function generatePoster() {
        const captureArea = document.getElementById('capture-area');
        
        html2canvas(captureArea, {
            scale: 2, // 提高清晰度
            backgroundColor: "#FFFFFF",
            useCORS: true 
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            document.getElementById('generated-poster').src = imgData;
            document.getElementById('poster-modal').style.display = 'flex';
        });
    }

    // 主动保存下载功能
    function downloadPoster() {
        const imgEl = document.getElementById('generated-poster');
        const a = document.createElement('a');
        a.href = imgEl.src;
        a.download = '苗友大考察_成绩单.png'; // 下载的文件名
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function closePoster() {
        document.getElementById('poster-modal').style.display = 'none';
    }
</script>

</body>
</html>
